name: Apply setup map section split

on:
  push:
    branches:
      - restart/setup-map-split-audit
    paths:
      - .github/workflows/apply-setup-map-split.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: restart/setup-map-split-audit

      - name: Split output sections and update audit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'kernel/kpimg.lds',
              '''    . = ALIGN(16);
              .setup.map : {
                  _map_start = .;
                  base/map.o(.map.data)
                  base/map.o(.map.text)
                  base/map.o(.text)
                  base/map1.o(.text)
                  . = ALIGN(16);
                  _map_end = .;
              }
              ASSERT(SIZEOF(.setup.map) < 0xa00, "Size too large of .setup.map!")
              ''',
              '''    . = ALIGN(16);
              .setup.map.data : {
                  _map_start = .;
                  base/map.o(.map.data)
              }
              .setup.map.text : {
                  base/map.o(.map.text)
                  base/map.o(.text)
                  base/map1.o(.text)
                  . = ALIGN(16);
                  _map_end = .;
              }
              ASSERT(
                  SIZEOF(.setup.map.data) + SIZEOF(.setup.map.text) < 0xa00,
                  "Combined size too large for setup map region!"
              )
              ''',
          )

          replace(
              'scripts/audit_kpimg_layout.py',
              '''    ".setup.map",
              ''',
              '''    ".setup.map.data",
                  ".setup.map.text",
              ''',
          )

          replace(
              'scripts/audit_kpimg_layout.py',
              '''                "setup_map_is_currently_wax": set("WAX").issubset(
                          set(sections[".setup.map"]["flags"])
                      ),
              ''',
              '''                "setup_map_data_is_writable_non_executable": (
                          "W" in sections[".setup.map.data"]["flags"]
                          and "X" not in sections[".setup.map.data"]["flags"]
                      ),
                      "setup_map_text_is_executable_non_writable": (
                          "X" in sections[".setup.map.text"]["flags"]
                          and "W" not in sections[".setup.map.text"]["flags"]
                      ),
                      "setup_map_sections_are_contiguous": (
                          sections[".setup.map.data"]["address"]
                          + sections[".setup.map.data"]["size"]
                          == sections[".setup.map.text"]["address"]
                      ),
              ''',
          )

          replace(
              'scripts/audit_kpimg_layout.py',
              '''    setup_map = sections.get(".setup.map")
                  if setup_map and "W" in setup_map["flags"] and "X" in setup_map["flags"]:
                      warnings.append(
                          "The .setup.map output section is both writable and executable because it "
                          "combines map data and map text. Splitting only ELF program headers would not "
                          "fully remove the W+X overlap."
                      )

              ''',
              '''    map_data_section = sections.get(".setup.map.data")
                  map_text_section = sections.get(".setup.map.text")
                  if map_data_section and "X" in map_data_section["flags"]:
                      warnings.append("The setup map data section is unexpectedly executable.")
                  if map_text_section and "W" in map_text_section["flags"]:
                      warnings.append("The setup map text section is unexpectedly writable.")

              ''',
          )

          Path('docs/SETUP_MAP_SPLIT_AUDIT.md').write_text(
              '''# Setup map section split audit

          Audit date: 2026-08-06

          ## Scope

          This change separates the existing setup-map input sections into two ELF output sections while preserving their original byte order:

          ```text
          .setup.map.data
              base/map.o(.map.data)

          .setup.map.text
              base/map.o(.map.text)
              base/map.o(.text)
              base/map1.o(.text)
          ```

          `_map_start` remains at the beginning of map data and `_map_end` remains after map code. No C source, function ordering, alignment constant, 64 KiB kernel boundary, program header, or raw-image conversion rule is changed.

          ## Intended result

          - `.setup.map.data` must be writable and non-executable (`WA`).
          - `.setup.map.text` must be executable and non-writable (`AX`).
          - both sections must remain contiguous;
          - the raw `kpimg` must remain byte-for-byte identical to the pre-split baseline when built from identical source with the same `SOURCE_DATE_EPOCH` and toolchain;
          - all required linker symbols and raw offsets must remain unchanged.

          ## Important limitation

          The ELF still uses one RWE LOAD segment. This section split removes the W+X flag from the individual setup-map output section, but does not by itself change program-header permissions. A PHDR split remains a separate boot-critical experiment.

          ## Merge gate

          The section split may be retained only if the dedicated experiment proves:

          1. candidate raw `kpimg` equals the baseline byte-for-byte;
          2. required linker symbol addresses are unchanged;
          3. `.setup.map.data=WA` and `.setup.map.text=AX`;
          4. the permanent layout audit passes;
          5. legacy release reproduction and current strict builds remain green.
          ''',
              encoding='utf-8',
          )
          PY

      - name: Remove one-time workflow and commit
        run: |
          set -euo pipefail
          rm .github/workflows/apply-setup-map-split.yml
          git config user.name kernelpatch-layout-bot
          git config user.email kernelpatch-layout-bot@users.noreply.github.com
          git add kernel/kpimg.lds scripts/audit_kpimg_layout.py docs/SETUP_MAP_SPLIT_AUDIT.md .github/workflows/apply-setup-map-split.yml
          git commit -m "refactor(linker): split setup map data and text sections"
          git push origin HEAD:restart/setup-map-split-audit
