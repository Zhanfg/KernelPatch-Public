name: Diagnose compiler warnings

on:
  push:
    branches:
      - restart/compiler-warning-cleanup
    paths:
      - .github/workflows/diagnose-warnings.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Locate warning symbols and call sites
        run: |
          set -u
          echo '=== is_trusted_manager_uid ==='
          grep -R -n --exclude-dir=.git 'is_trusted_manager_uid' . || true
          echo '=== umount_init ==='
          grep -R -n --exclude-dir=.git 'umount_init' . || true
          echo '=== int rc declarations ==='
          grep -R -n --exclude-dir=.git -E 'int rc([ ;=]|$)' kernel/patch tools || true
          echo '=== kallsym format sites ==='
          nl -ba tools/kallsym.c | sed -n '210,250p'
          echo '=== module includes and umount call ==='
          grep -n -B8 -A8 'umount_init' kernel/patch/module/module.c || true
          echo '=== linker scripts ==='
          find kernel -maxdepth 3 -type f \( -name '*.lds' -o -name '*.ld' \) -print
          grep -R -n -E 'PHDRS|FLAGS|RWX|LOAD' kernel --include='*.lds' --include='*.ld' || true
