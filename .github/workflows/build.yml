name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.13.4)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install cross compiler
      run: |
        curl -o toolchain.tar.xz https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
        tar -xf toolchain.tar.xz
        echo "TOOLCHAIN=$(pwd)/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-" >> $GITHUB_ENV

    - name: Build kpimg (Android)
      run: |
        export TARGET_COMPILE=${{ env.TOOLCHAIN }}
        cd kernel && make ANDROID=1 && mv kpimg kpimg-android && mv kpimg.elf kpimg.elf-android && make clean

    - name: Build kpimg (Linux)
      run: |
        export TARGET_COMPILE=${{ env.TOOLCHAIN }}
        cd kernel && make && mv kpimg kpimg-linux && mv kpimg.elf kpimg.elf-linux && make clean

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r26b
        add-to-path: true

    - name: Build kptools-android
      run: |
        export TARGET_COMPILE=placeholder
        cd kernel && make hdr && cd ..
        cd tools && mkdir -p build/android && cd build/android
        cmake -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
          -DCMAKE_BUILD_TYPE=Release -DANDROID_PLATFORM=android-33 -DANDROID_ABI=arm64-v8a ../..
        cmake --build .
        ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip kptools
        mv kptools kptools-android

    - name: Build kptools-linux
      run: |
        export TARGET_COMPILE=placeholder
        cd kernel && make hdr && cd ..
        cd tools && mkdir -p build && cd build && cmake .. && make
        mv kptools kptools-linux

    - name: Package kpuser
      run: |
        export TARGET_COMPILE=placeholder
        cd kernel && make hdr && cd ..
        zip -r kpuser.zip user

    - name: Create release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ inputs.version }}
        name: "KernelPatch ${{ inputs.version }}"
        artifacts: |
          kernel/kpimg-android
          kernel/kpimg-linux
          tools/build/android/kptools-android
          tools/build/kptools-linux
          kpuser.zip
        generateReleaseNotes: true
        allowUpdates: true
        replacesArtifacts: true
        body: |
          KernelPatch with KSU features — stable release.
          See [CHANGELOG](https://github.com/Zhanfg/KernelPatch-Public/blob/main/CHANGELOG.md) for details.
