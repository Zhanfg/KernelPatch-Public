name: Verify KernelPatch build

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - restart/linker-layout-audit
  workflow_dispatch:

env:
  LEGACY_TAG: 0.13.3
  LEGACY_COMMIT: e26a2e14e3b8d60a19dd3c7f354a777faa574f4f
  ARM_TOOLCHAIN_URL: https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
  ARM_TOOLCHAIN_SHA256: 62d66e0ad7bd7f2a183d236ee301a5c73c737c886c7944aa4f39415aab528daf
  KPIMG_LINUX_SHA256: 7b8cf7e97169d2d73bba2e11653ad5bdbc6fc6251c5507b8d108f4a2e0bcd76f
  KPTOOLS_ANDROID_SHA256: ebf9b8eb17b4b3a6b1d4959402033bb1c6c4044d0e2532d480c34d1f412d5225

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Verify immutable legacy baseline
        run: |
          set -euo pipefail
          tag=$(jq -r '.releaseTag' release-baseline.json)
          commit=$(jq -r '.releaseCommit' release-baseline.json)
          source_version=$(jq -r '.sourceVersion' release-baseline.json)
          status=$(jq -r '.status' release-baseline.json)
          test "$tag" = "$LEGACY_TAG"
          test "$commit" = "$LEGACY_COMMIT"
          test "$status" = legacy-version-mismatch-reproducible
          test "$(jq -r '.reproducibility.kpimgLinuxByteIdentical' release-baseline.json)" = true
          test "$(jq -r '.reproducibility.kptoolsAndroidByteIdentical' release-baseline.json)" = true

          git fetch --tags --force
          resolved=$(git rev-list -n 1 "$LEGACY_TAG")
          test "$resolved" = "$LEGACY_COMMIT" || {
            echo "::error::Legacy tag moved: expected $LEGACY_COMMIT, got $resolved"
            exit 1
          }

          echo "CURRENT_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "LEGACY_SOURCE_VERSION=$source_version" >> "$GITHUB_ENV"

      - name: Download trusted legacy assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reference="$RUNNER_TEMP/kernelpatch-reference"
          mkdir -p "$reference"
          gh release download "$LEGACY_TAG" \
            -R Zhanfg/KernelPatch-Public \
            -p kpimg-linux \
            -p kptools-android \
            -D "$reference"
          echo "$KPIMG_LINUX_SHA256  $reference/kpimg-linux" | sha256sum -c -
          echo "$KPTOOLS_ANDROID_SHA256  $reference/kptools-android" | sha256sum -c -
          echo "REFERENCE_DIR=$reference" >> "$GITHUB_ENV"

      - name: Recover legacy compile timestamp
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import os
          import re
          from pathlib import Path

          data = (Path(os.environ['REFERENCE_DIR']) / 'kpimg-linux').read_bytes()
          match = re.search(rb'(\d{2}:\d{2}:\d{2} [A-Z][a-z]{2} [ 0-9]\d 20\d{2})', data)
          if not match:
              raise SystemExit('compile timestamp not found in legacy kpimg-linux')
          stamp = match.group(1).decode('ascii')
          dt = datetime.datetime.strptime(stamp, '%H:%M:%S %b %d %Y').replace(
              tzinfo=datetime.timezone.utc
          )
          epoch = int(dt.timestamp())
          print(f'Legacy compile timestamp: {stamp} (SOURCE_DATE_EPOCH={epoch})')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'LEGACY_SOURCE_DATE_EPOCH={epoch}\n')
              env.write(f'LEGACY_COMPILE_TIME={stamp}\n')
          PY

      - name: Download and verify Arm toolchain
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/arm-toolchain.tar.xz"
          toolchain_root="$RUNNER_TEMP/arm-toolchain"
          curl -fL --retry 3 --retry-delay 2 \
            "$ARM_TOOLCHAIN_URL" \
            -o "$archive"
          actual=$(sha256sum "$archive" | awk '{print $1}')
          echo "::notice title=Arm toolchain SHA256::$actual"
          test "$actual" = "$ARM_TOOLCHAIN_SHA256" || {
            echo "::error::Arm toolchain SHA256 mismatch: expected=$ARM_TOOLCHAIN_SHA256 actual=$actual"
            exit 1
          }
          mkdir -p "$toolchain_root"
          tar -xf "$archive" -C "$toolchain_root"
          prefix="$toolchain_root/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-"
          test -x "${prefix}gcc"
          echo "TOOLCHAIN=$prefix" >> "$GITHUB_ENV"

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        with:
          ndk-version: r26b

      - name: Checkout legacy source at repository root
        run: |
          set -euo pipefail
          git reset --hard
          git clean -fdx
          git checkout --detach "$LEGACY_COMMIT"
          declared=$(awk '/#define MAJOR/{a=$3} /#define MINOR/{b=$3} /#define PATCH/{c=$3} END{print a "." b "." c}' version)
          test "$declared" = "$LEGACY_SOURCE_VERSION"
          test "$declared" != "$LEGACY_TAG"

      - name: Reproduce legacy kpimg Linux
        run: |
          set -euo pipefail
          TARGET_COMPILE="$TOOLCHAIN" \
            SOURCE_DATE_EPOCH="$LEGACY_SOURCE_DATE_EPOCH" \
            make -C kernel clean
          TARGET_COMPILE="$TOOLCHAIN" \
            SOURCE_DATE_EPOCH="$LEGACY_SOURCE_DATE_EPOCH" \
            make -C kernel
          cp kernel/kpimg legacy-kpimg-linux
          actual=$(sha256sum legacy-kpimg-linux | awk '{print $1}')
          echo "::notice title=legacy kpimg-linux SHA256::$actual"
          cmp legacy-kpimg-linux "$REFERENCE_DIR/kpimg-linux"
          test "$actual" = "$KPIMG_LINUX_SHA256"

      - name: Reproduce legacy kptools Android
        run: |
          set -euo pipefail
          TARGET_COMPILE=placeholder \
            SOURCE_DATE_EPOCH="$LEGACY_SOURCE_DATE_EPOCH" \
            make -C kernel hdr
          cmake -S tools -B tools/build/android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_PLATFORM=android-33 \
            -DANDROID_ABI=arm64-v8a
          cmake --build tools/build/android --parallel
          "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            tools/build/android/kptools
          cp tools/build/android/kptools legacy-kptools-android
          actual=$(sha256sum legacy-kptools-android | awk '{print $1}')
          echo "::notice title=legacy kptools-android SHA256::$actual"
          cmp legacy-kptools-android "$REFERENCE_DIR/kptools-android"
          test "$actual" = "$KPTOOLS_ANDROID_SHA256"

      - name: Restore current source
        run: |
          set -euo pipefail
          git reset --hard
          git clean -fdx
          git checkout --detach "$CURRENT_SHA"
          test "$(git rev-parse HEAD)" = "$CURRENT_SHA"

      - name: Build current kpimg with strict warnings
        run: |
          set -euo pipefail
          current_epoch=$(git show -s --format=%ct HEAD)
          TARGET_COMPILE="$TOOLCHAIN" make -C kernel clean
          TARGET_COMPILE="$TOOLCHAIN" \
            SOURCE_DATE_EPOCH="$current_epoch" \
            EXTRA_CFLAGS="-Werror=implicit-function-declaration -Werror=unused-variable -Werror=int-conversion" \
            make -C kernel
          cp kernel/kpimg kpimg-linux-current
          test -s kpimg-linux-current
          sha256sum kpimg-linux-current

      - name: Audit current kpimg linker layout
        run: |
          set -euo pipefail
          mkdir -p layout-audit
          "${TOOLCHAIN}readelf" -lW kernel/kpimg.elf > layout-audit/program-headers.txt
          "${TOOLCHAIN}readelf" -SW kernel/kpimg.elf > layout-audit/sections.txt
          "${TOOLCHAIN}nm" -n kernel/kpimg.elf > layout-audit/symbols.txt
          python3 scripts/audit_kpimg_layout.py \
            --elf kernel/kpimg.elf \
            --raw kernel/kpimg \
            --readelf "${TOOLCHAIN}readelf" \
            --nm "${TOOLCHAIN}nm" \
            --json layout-audit/report.json \
            --markdown layout-audit/report.md

      - name: Build current kptools with strict format checks
        run: |
          set -euo pipefail
          TARGET_COMPILE=placeholder make -C kernel hdr
          cmake -S tools -B tools/build/android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_PLATFORM=android-33 \
            -DANDROID_ABI=arm64-v8a
          cmake --build tools/build/android --parallel
          "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            tools/build/android/kptools
          cp tools/build/android/kptools kptools-android-current
          test -s kptools-android-current
          sha256sum kptools-android-current

      - name: Upload current verification artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: kernelpatch-current-${{ github.sha }}
          path: |
            kpimg-linux-current
            kptools-android-current
            layout-audit/
          if-no-files-found: warn
          retention-days: 14
